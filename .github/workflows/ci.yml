name: 工程验证

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/book-sharing'
      - 'codex/reader-content-fixes'
      - 'IsLand-x/完全重构项目'
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: 强制完整浏览器回归
        type: boolean
        default: false
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 选择回归范围
        id: plan
        env:
          REGRESSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          REGRESSION_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_regression) || github.event_name == 'schedule' }}
        run: node scripts/regression-plan.mjs

  verify:
    needs: plan
    if: needs.plan.outputs.mode != 'none'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成构建信息
        id: metadata
        run: echo "updated_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: 测试与构建
        env:
          APP_BUILD_REVISION: ${{ github.sha }}
          APP_UPDATED_AT: ${{ steps.metadata.outputs.updated_at }}
          # Browser regressions serve local assets; ordinary production pushes build the CDN variant once.
          LEARNING_CENTER_ASSET_ORIGIN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full_regression)) && vars.LEARNING_CENTER_ASSET_ORIGIN || '' }}
        run: |
          node --test scripts/regression-plan.test.mjs
          npm run verify

      - name: 浏览器与视觉回归
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_regression) || github.event_name == 'schedule'
        env:
          REGRESSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          REGRESSION_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_regression) || github.event_name == 'schedule' }}
        run: node scripts/regression-plan.mjs --run-browser

      - name: 完整回归后生成 CDN 发布产物
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.full_regression && vars.LEARNING_CENTER_ASSET_ORIGIN != ''
        env:
          APP_BUILD_REVISION: ${{ github.sha }}
          APP_UPDATED_AT: ${{ steps.metadata.outputs.updated_at }}
          LEARNING_CENTER_ASSET_ORIGIN: ${{ vars.LEARNING_CENTER_ASSET_ORIGIN }}
        run: npm run build:web

      - name: 打包已验证的生产产物
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: tar -cf release-bundle.tar dist server-dist

      - name: 传递生产产物
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: release-bundle.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: true

      - name: 保留浏览器验证产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: test-results/

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
