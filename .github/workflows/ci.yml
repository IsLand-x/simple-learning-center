name: 工程验证

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'IsLand-x/完全重构项目'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试与构建
        run: npm run verify

      - name: 安装浏览器与中文字体
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 浏览器与视觉回归
        env:
          LEARNING_CENTER_E2E_BROWSER: chromium
          LEARNING_CENTER_E2E_PRODUCTION: '1'
        run: npm run test:e2e

      - name: 保留浏览器验证产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: test-results/

      - name: 检查生产依赖安全告警
        run: npm audit --omit=dev --audit-level=high

      - name: 验证 Docker 镜像构建
        run: docker build --tag learning-center:ci .
