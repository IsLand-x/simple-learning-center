name: 工程验证

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 测试与构建
        run: npm run verify

      - name: 检查生产依赖安全告警
        run: npm audit --omit=dev --audit-level=high

      - name: 验证 Docker 镜像构建
        run: docker build --tag learning-center:ci .
